<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipment Status</title>

<style>

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  margin:0;
  background:transparent;
}

.card{
  max-width:360px;
  margin:0 8px 12px;
  border-radius:12px;
  overflow:hidden;
  background:white;
}

.header{
  padding:16px 20px;
  font-weight:600;
  font-size:16px;
  border-bottom:1px solid transparent;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.badge{
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}

.badge-transit{
  background:#dbeafe;
  color:black;
}

.badge-delivered{
  background:#a2d99c;
  color:white;
}

.badge-processing{
  background:#dbeafe;
  color:black;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:12px 20px;
  border-bottom:1px solid transparent;
  font-size:14px;
}

.row:last-child{
  border-bottom:none;
}

.label{
  color:#6b7280;
}

.value{
  font-weight:500;
  text-align:right;
}

</style>
</head>

<body>

<div id="app"></div>

<script>

const params = new URLSearchParams(window.location.search);
const raw = params.get('data');

let data = null;

if(raw){
  try{
    data = JSON.parse(decodeURIComponent(raw));
  }catch(e){}
}

const app = document.getElementById("app");

if(data){

  let badgeClass = "badge-processing";

  if(data.shipmentStatus === "In Transit"){
    badgeClass = "badge-transit";
  }

  if(data.shipmentStatus === "Delivered"){
    badgeClass = "badge-delivered";
  }

  app.innerHTML = `
  <div class="card">

    <div class="header">
      <span>Replacement Shipment</span>
      <span class="badge ${badgeClass}">
        ${data.shipmentStatus}
      </span>
    </div>

    <div class="row">
      <span class="label">Shipment ID</span>
      <span class="value">${data.shipmentId}</span>
    </div>

    <div class="row">
      <span class="label">Ship Date</span>
      <span class="value">${data.shipDate}</span>
    </div>

    <div class="row">
      <span class="label">Expected Delivery</span>
      <span class="value">${data.expectedDeliveryDate}</span>
    </div>

  </div>
  `;

}

const height = Math.ceil(document.documentElement.scrollHeight);

if(window.parent !== window){
  window.parent.postMessage(
    { source:"zowie-visual-aid", type:"visualAidResize", height:height },
    "*"
  );
}

</script>

</body>
</html>
