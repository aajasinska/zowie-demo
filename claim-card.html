<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claim Status</title>

<style>

body{
  font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  margin:0;
  background:transparent;
}

.card-hello{
  max-width:360px;
  margin:0 8px 12px;
  border-radius:12px;
  background:white;
  overflow:hidden;
}

.card-chat{
  max-width:360px;
  margin:0 8px 12px;
  border-radius:12px;
  background:#fbf0e1;
  overflow:hidden;
}

.header{
  padding:16px 20px;
  font-weight:600;
  font-size:16px;
  border-bottom:1px solid transparent;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.badge{
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}

.badge-approved{
  background:#a2d99c;
  color:white;
}

.badge-denied{
  background:#e69595;
  color:black;
}

.badge-delivered{
  background:#a2d99c;
  color:white;
}

.badge-processing{
  background:#e6e3df;
  color:black;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:12px 20px;
  border-bottom:1px solid transparent;
  font-size:14px;
}

.row:last-child{
  border-bottom:none;
}

.label{
  color:#6b7280;
}

.value{
  font-weight:500;
  text-align:right;
}

</style>
</head>

<body>

<div id="app"></div>

<script>

const params = new URLSearchParams(window.location.search);
const raw = params.get('data');

let data = null;

if(raw){
  try{
    data = JSON.parse(decodeURIComponent(raw));
  }catch(e){}
}
  
var surface = params.get('surface');
const app = document.getElementById("app");

if(data){

  let claimBadgeClass = "badge-approved";
  let shipBadgeClass = "badge-processing";
  var style = surface === 'hello' ? 'hello' : 'chat';
  
  if(data.claimStatus === "Denied"){
    claimBadgeClass = "badge-denied";
  }

  if (data.shipmentStatus && data.shipmentStatus.includes("Delivered")){
    shipBadgeClass = "badge-delivered";
  } else if (data.shipmentStatus && data.shipmentStatus.includes("Transit")) {
    shipBadgeClass = "badge-processing";
  }

  let deliveryLabel = "Expected Delivery";
  let deliveryValue = data.expectedDeliveryDate;
  
  if (data.shipmentStatus && data.shipmentStatus.includes("Delivered") && data.actualDeliveryDate) {
    deliveryLabel = "Delivered On";
    deliveryValue = data.actualDeliveryDate;
  }

  let shipmentLabel = "Preparing";
  
  if (data.shipmentStatus && data.shipmentStatus.includes("Delivered") && data.actualDeliveryDate) {
    shipmentLabel = "Delivered";
  } else if (data.shipmentStatus && data.shipmentStatus.includes("Transit")) {
    shipmentLabel = "In Transit";
  }
  
  let shipmentCard = "";

  if(data.shipmentId){
    shipmentCard = `
      <div class="card-${style}">
  
      <div class="header">
        <span>Your Shipment</span>
        <span class="badge ${shipBadgeClass}">
          ${shipmentLabel}
        </span>
      </div>
  
      <div class="row">
        <span class="label">Shipment ID</span>
        <span class="value">${data.shipmentId}</span>
      </div>
  
      <div class="row">
        <span class="label">Ship Date</span>
        <span class="value">${data.shipDate}</span>
      </div>
  
      <div class="row">
        <span class="label">${deliveryLabel}</span>
        <span class="value">${deliveryValue}</span>
      </div>
  
    </div>
      `;
  }
  
  app.innerHTML = `
  <div class="card-${style}">

    <div class="header">
      <span>Claim Status</span>
      <span class="badge ${claimBadgeClass}">
        ${data.claimStatus}
      </span>
    </div>

    <div class="row">
      <span class="label">Claim ID</span>
      <span class="value">${data.claimId}</span>
    </div>

    <div class="row">
      <span class="label">Reason</span>
      <span class="value">${data.statusReason}</span>
    </div>

  </div>

  ${shipmentCard}
  `;

}

const height = Math.ceil(document.documentElement.scrollHeight);

if(window.parent !== window){
  window.parent.postMessage(
    { source:"zowie-visual-aid", type:"visualAidResize", height:height },
    "*"
  );
}

</script>

</body>
</html>
