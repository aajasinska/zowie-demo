<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claim Lookup</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  margin:0;
  background:transparent;
}

.card{
  max-width:360px;
  margin:0 8px 12px;
  border-radius:12px;
  background:#f9fafb;
  overflow:hidden;
  border:1px solid #e5e7eb;
}

.header{
  padding:16px 20px;
  font-weight:600;
  font-size:16px;
  border-bottom:1px solid #e5e7eb;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:12px 20px;
  border-bottom:1px dashed #e5e7eb;
  font-size:14px;
}

.row:last-child{
  border-bottom:none;
}

.label{
  color:#6b7280;
}

.value{
  font-weight:500;
}

.footer{
  padding:14px 20px;
  font-size:13px;
  color:#4b5563;
  background:#f3f4f6;
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const params = new URLSearchParams(window.location.search);
const raw = params.get('data');

let data = null;

if(raw){
  try{
    data = JSON.parse(decodeURIComponent(raw));
  }catch(e){}
}

const app = document.getElementById("app");

if(data){

  app.innerHTML = `
  <div class="card">
  
    <div class="header">
      Checking your warranty claim
    </div>

    <div class="row">
      <span class="label">Email</span>
      <span class="value">${data.email}</span>
    </div>

    <div class="row">
      <span class="label">Order Number</span>
      <span class="value">${data.orderNumber}</span>
    </div>

    <div class="footer">
      We're retrieving your warranty claim information now.
    </div>

  </div>
  `;

}

const height = Math.ceil(document.documentElement.scrollHeight);

if(window.parent !== window){
  window.parent.postMessage(
    { source:"zowie-visual-aid", type:"visualAidResize", height:height },
    "*"
  );
}

</script>

</body>
</html>
